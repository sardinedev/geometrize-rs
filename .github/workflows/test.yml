name: Test

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup rust toolchain and cache
        uses: moonrepo/setup-rust@v1
        with:
          channel: stable

      - name: Run tests
        run: cargo test --workspace
