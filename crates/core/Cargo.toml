[package]
name = "geometrize-core"
description = "Approximate images with semi-transparent triangles (a trimmed Rust port of fogleman/primitive)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
# Run the independent hill-climb searches of each step on rayon's thread pool.
# Output is identical with or without this feature, whatever the thread count.
parallel = ["dep:rayon"]

[dependencies]
rayon = { version = "1", optional = true }

# Both are only for the benchmarks, so they're left out when testing on
# WebAssembly: `codspeed` (behind divan) needs Unix-only crates. The crate
# itself stays dependency-free.
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
divan = { version = "6.0.0", package = "codspeed-divan-compat" }
# Decodes the real photo in `fixtures/` for the photo benchmarks.
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[[bench]]
name = "model"
harness = false

[lints]
workspace = true
