[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
# Keep in step with `channel` in rust-toolchain.toml.
rust-version = "1.99"

# Lints shared by every crate (each opts in with `[lints] workspace = true`).
# They warn locally and fail CI, which runs clippy with `-D warnings`.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# The stricter `pedantic` group, minus the lints below. `priority = -1`
# applies the group first, so the individual settings override it.
pedantic = { level = "warn", priority = -1 }
# Casts: pixel maths moves between u8 channels, i32 coordinates, usize
# indexes and f64 constantly. Each `as` here converts a value that is already
# clamped or known to be in range (validated, or clipped to the image);
# `try_from(..).expect(..)` on every one would only hurt readability.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
# `push_str(&format!(..))` is kept on purpose: it reads more plainly than
# `write!` into a String (see docs/DECISIONS.md).
format_push_string = "allow"
# Suppressions must say why: `#[expect(clippy::lint, reason = "...")]`.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# Leftovers that shouldn't be merged.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# `#[ignore]` tests must say why they're ignored.
ignore_without_reason = "warn"

[profile.release]
lto = "fat"
codegen-units = 1

# The search runs millions of pixel operations, so tests are far too slow
# without optimisation. Level 1 keeps them quick while still compiling fast.
[profile.test]
opt-level = 1
