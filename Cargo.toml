[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.99"

[profile.release]
lto = "fat"
codegen-units = 1

# The search runs millions of pixel operations, so tests are far too slow
# without optimisation. Level 1 keeps them quick while still compiling fast.
[profile.test]
opt-level = 1
